<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ayaan's Movie Recommender - Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XMFVC13WBE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-XMFVC13WBE');
  </script>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="icon" href="logo.ico" type="image/x-icon">

  <script>
    (() => {
      const root = document.documentElement;
      const media = window.matchMedia('(prefers-color-scheme: dark)');

      function applyTheme() {
        // Follow system preference
        root.setAttribute('data-bs-theme', media.matches ? 'dark' : 'light');
      }

      applyTheme();

      // Update if the user changes OS theme while the page is open
      if (typeof media.addEventListener === 'function') {
        media.addEventListener('change', applyTheme);
      } else if (typeof media.addListener === 'function') {
        // Safari / older browsers
        media.addListener(applyTheme);
      }
    })();
  </script>

</head>

<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="auto">
    <div class="container-fluid">
      <span class="navbar-brand">Movie Recommender</span>
      <div class="d-flex">
        <button id="btn-logout" class="btn btn-outline-secondary btn-sm">Log out of this device</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
      <div>
        <h3>Dashboard</h3>
      </div>
      <div>
        <a href="recommend.html" class="btn btn-primary me-2">Get Recommendation</a>
        <button id="btn-reset" class="btn btn-outline-danger">Reset History</button>
      </div>
    </div>

    <div id="alert" class="alert d-none" role="alert"></div>

    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Your profile code</h5>
        <p class="text-muted small mb-2">
          This is your login. Paste it on the start page of any device to restore your taste. It changes as you rate.
        </p>
        <input id="profile-code" class="form-control font-monospace mb-2" readonly
               aria-label="Profile code" onclick="this.select()">
        <div class="d-flex flex-wrap gap-2 align-items-center">
          <button id="btn-copy-code" class="btn btn-sm btn-outline-primary">Copy code</button>
          <button id="btn-copy-link" class="btn btn-sm btn-outline-secondary">Copy resume link</button>
          <span id="copy-status" class="small text-success" aria-live="polite"></span>
        </div>
        <p id="code-note" class="small text-muted mt-2 mb-0"></p>
      </div>
    </div>

    <p id="rating-summary" class="fw-semibold mb-3"></p>


    <div class="card">
      <div class="card-body">
        <h5 class="card-title mb-3">Rated Movies</h5>
        <div class="table-responsive">
          <table class="table table-striped table-hover" id="history-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Movie</th>
                <th>Rating</th>
                <th>Favorite</th>
                <th>Rated At</th>
              </tr>
            </thead>
            <tbody id="history-body">
              <!-- rows injected by dashboard.js -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
